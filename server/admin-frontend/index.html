<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bizon MDM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Set initial theme before styles to avoid flash
    (function(){
      try{
        var t = localStorage.getItem('theme');
        if(!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){ t='dark'; }
        if(t){ document.documentElement.setAttribute('data-theme', t); }
      }catch(e){}
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --primary: #3b82f6;
      --primary-600: #2563eb;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #16a34a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --table-head-bg: #f3f4f6;
      --table-head-fg: #111827;
      --hover-bg: #f9fafb;
      --nav-hover-bg: #eef2ff;
      --nav-active-bg: var(--primary);
      --nav-active-fg: #ffffff;
      --control-bg: #ffffff;
      --control-fg: var(--text);
      --control-border: var(--border);
    }
    [data-theme="dark"] {
      --primary: #60a5fa;
      --primary-600: #3b82f6;
      --bg: #0f172a;
      --surface: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --success: #22c55e;
      --danger: #f87171;
      --warning: #fbbf24;
      --table-head-bg: #0b1220;
      --table-head-fg: #e5e7eb;
      --hover-bg: #0b1220;
      --nav-hover-bg: rgba(96,165,250,0.12);
      --nav-active-bg: rgba(96,165,250,0.22);
      --nav-active-fg: #e5e7eb;
      --control-bg: #0b1220;
      --control-fg: var(--text);
      --control-border: var(--border);
      color-scheme: dark;
    }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--surface); color: var(--text);
      border-right: 1px solid var(--border); padding: 1rem .75rem; position: sticky; top: 0; height: 100vh;
    }
    .sidebar .logo { display: flex; align-items: center; gap: .5rem; font-weight: 700; margin: .25rem .5rem 1rem; }
    .sidebar .logo-badge { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; color:#fff; font-weight:800; }
    .sidebar nav { display: grid; gap: .25rem; }
    .nav-item { display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem; border-radius:10px; color: var(--muted); text-decoration:none; transition: background .2s, color .2s; }
    .nav-item:hover { background: var(--nav-hover-bg); color: var(--text); }
    .nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-fg); }
    .nav-item .icon { width: 18px; height: 18px; display:inline-block; }

    .content { flex: 1; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); margin-right: .5rem; }
    nav {
      display: flex; gap: .75rem; flex-wrap: wrap;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      padding: .4rem .6rem;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
  nav a:hover { background: var(--nav-hover-bg); color: var(--primary); }
  nav a.active { background: var(--nav-active-bg); color: var(--nav-active-fg); }
    .spacer { flex: 1; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; }
    .token-input {
      padding: .45rem .6rem; border: 1px solid var(--control-border); border-radius: 6px; min-width: 240px;
      background: var(--control-bg); color: var(--control-fg);
    }
  .search { flex:1; max-width: 520px; margin-left: 1rem; }
  .search input { width:100%; padding:.5rem .75rem; border:1px solid var(--control-border); border-radius:10px; background: var(--control-bg); color: var(--control-fg); }
  .avatar { width:32px; height:32px; border-radius:50%; background: linear-gradient(135deg, var(--primary), transparent); border:1px solid var(--border); }

  main { padding: 1.25rem; }
  .container { max-width: 1200px; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
      padding: 1rem; margin-bottom: 1rem;
    }
  .kpi-grid { display:grid; gap:1rem; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media (min-width: 900px){ .kpi-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  .card-stat { display:flex; flex-direction:column; gap:.35rem; }
  .card-stat h4 { margin:0; font-size:.9rem; color:var(--muted); font-weight:600; }
  .card-stat .value { font-size:1.6rem; font-weight:800; }
  .chip { display:inline-flex; align-items:center; gap:.35rem; font-size:.75rem; padding:.15rem .5rem; border-radius:999px; border:1px solid var(--border); }
  .gradient { background: linear-gradient(135deg, rgba(59,130,246,.08), transparent); }
  [data-theme="dark"] .gradient { background: linear-gradient(135deg, rgba(96,165,250,.18), rgba(0,0,0,.05)); }
    h2 { margin: 0 0 .75rem 0; font-size: 1.25rem; }
    h3 { margin: 1rem 0 .5rem 0; font-size: 1.1rem; }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 768px) { .grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }

  table {
      width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    th, td { padding: .75rem .9rem; border-bottom: 1px solid var(--border); }
  thead th { background: var(--table-head-bg); color: var(--table-head-fg); text-align: left; font-weight: 600; }
  tbody tr:hover { background: var(--hover-bg); }
    tbody tr:last-child td { border-bottom: 0; }

    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    button {
      appearance: none; border: 1px solid var(--control-border); background: var(--control-bg); color: var(--control-fg);
      padding: .5rem .75rem; border-radius: 8px; cursor: pointer; transition: all .2s;
    }
    button:hover { border-color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.1); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary-600); }
  .btn-danger { background: var(--danger); color: #fff; border-color: rgba(0,0,0,.2); }
  .btn-warning { background: var(--warning); color: #111827; border-color: rgba(0,0,0,.2); }
  .input, input, select { padding: .5rem .6rem; border: 1px solid var(--control-border); border-radius: 8px; background: var(--control-bg); color: var(--control-fg); }
    .muted { color: var(--muted); }
    .badge { display: inline-block; padding: .2rem .5rem; border-radius: 999px; font-size: .75rem; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-warn { background: #fef3c7; color: #92400e; }
    .badge-err { background: #fee2e2; color: #991b1b; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>
    <!-- Use Babel 7 and enable modern syntax (optional chaining, nullish coalescing) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining,proposal-nullish-coalescing-operator" src="admin/dashboard/index.jsx"></script>
      <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining,proposal-nullish-coalescing-operator" src="admin/clients/index.jsx"></script>
      <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining,proposal-nullish-coalescing-operator" src="admin/logs/index.jsx"></script>
      <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining,proposal-nullish-coalescing-operator" src="app.jsx"></script>
  </body>
  </html>
