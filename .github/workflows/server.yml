name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install pytest black isort flake8
      - name: Lint
        run: |
          black --check server
          isort --check-only server
          flake8 server
      - name: Test
        run: pytest server/tests
      - name: Build
        run: python -m py_compile server/server.py
