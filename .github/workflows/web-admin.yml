name: Web Admin CI

on:
  push:
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin.yml'
  pull_request:
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin.yml'

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci --prefix web-admin
      - run: npm run lint --prefix web-admin
      - run: npm run build --prefix web-admin
